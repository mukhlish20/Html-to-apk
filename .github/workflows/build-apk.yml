name: Build HTML to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: 4b. Generate App Icon Otomatis
        run: |
          npx @capacitor/assets generate --android

      - name: 5. Compile Debug APK dengan Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Upload File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Siap-Install-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
